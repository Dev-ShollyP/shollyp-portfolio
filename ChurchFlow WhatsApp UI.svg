<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <!-- Background -->
  <rect width="600" height="380" fill="#EFEAE2" />

  <!-- WhatsApp Header Bar -->
  <rect width="600" height="60" fill="#075E54" />
  
  <!-- Back arrow & Avatar -->
  <g transform="translate(16, 12)">
    <circle cx="26" cy="18" r="16" fill="#128C7E" />
    <path d="M26 12 C29 12 31 14 31 17 C31 20 29 22 26 22 C23 22 21 20 21 17 C21 14 23 12 26 12 Z M20 28 C20 25 23 23 26 23 C29 23 32 25 32 28 Z" fill="#FFFFFF" opacity="0.9" />
    
    <text x="52" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">RCCG Everflourishing Assistant</text>
    <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#A7F3D0">online · automated church assistant</text>
  </g>

  <!-- Encryption Notice -->
  <g transform="translate(120, 72)">
    <rect width="360" height="22" rx="6" fill="#FFEECD" />
    <text x="180" y="15" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#524838">🔒 Messages are end-to-end encrypted with Meta WhatsApp Cloud API</text>
  </g>

  <!-- User Message (Right) -->
  <g transform="translate(480, 104)">
    <rect width="90" height="34" rx="8" fill="#D9FDD3" />
    <text x="14" y="21" font-family="-apple-system, sans-serif" font-size="13" fill="#111B21">Hi</text>
    <text x="64" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#667781">10:41</text>
    <path d="M78 20 L81 23 L85 18" stroke="#53BDEB" stroke-width="1.2" fill="none" />
  </g>

  <!-- Bot Welcome Message (Left) -->
  <g transform="translate(24, 146)">
    <rect width="420" height="136" rx="8" fill="#FFFFFF" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.06))" />
    <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#075E54">RCCG Everflourishing Mega Sanctuary 🙏</text>
    
    <text x="14" y="42" font-family="-apple-system, sans-serif" font-size="12" fill="#111B21">Welcome! How can we serve you today?</text>
    <text x="14" y="62" font-family="-apple-system, sans-serif" font-size="11.5" fill="#3B4A54">1️⃣  Service Times &amp; Directions</text>
    <text x="14" y="80" font-family="-apple-system, sans-serif" font-size="11.5" fill="#3B4A54">2️⃣  Submit a Prayer Request</text>
    <text x="14" y="98" font-family="-apple-system, sans-serif" font-size="11.5" fill="#3B4A54">3️⃣  Book Pastoral Counseling</text>
    <text x="14" y="116" font-family="-apple-system, sans-serif" font-size="11.5" fill="#3B4A54">4️⃣  Online Giving &amp; Bank Details</text>
    
    <text x="382" y="126" font-family="-apple-system, sans-serif" font-size="9" fill="#667781">10:41</text>
  </g>

  <!-- User Selection (Right) -->
  <g transform="translate(460, 292)">
    <rect width="110" height="34" rx="8" fill="#D9FDD3" />
    <text x="14" y="21" font-family="-apple-system, sans-serif" font-size="12" fill="#111B21">1 (Service Times)</text>
    <text x="86" y="24" font-family="-apple-system, sans-serif" font-size="9" fill="#667781">10:42</text>
  </g>

  <!-- Bot Service Times Response (Left) -->
  <g transform="translate(24, 334)">
    <rect width="380" height="38" rx="8" fill="#FFFFFF" />
    <text x="14" y="18" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#111B21">Sundays: 7:30 AM &amp; 9:30 AM · Wednesdays: 6:00 PM</text>
    <text x="14" y="31" font-family="-apple-system, sans-serif" font-size="10.5" fill="#667781">Arena Sanctuary, Lagos · We look forward to having you!</text>
  </g>
</svg>
