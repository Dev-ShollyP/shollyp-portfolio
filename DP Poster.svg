<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F94" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#02140F" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dpBg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="690" cy="80" r="220" fill="#10B981" opacity="0.14" />
  <circle cx="110" cy="390" r="180" fill="#3B82F6" opacity="0.15" />

  <!-- Category Badge -->
  <g transform="translate(48, 42)">
    <rect width="250" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" />
    <circle cx="20" cy="17" r="5" fill="#10B981" />
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="1">CREATIVE AI MEDIA SPOTLIGHT</text>
  </g>

  <!-- Big Title -->
  <text x="48" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    "DP" PROMO SHOWCASE
  </text>
  <text x="48" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#6EE7B7" font-weight="600">
    Dynamic Character Continuity, Stylized Motion &amp; Brand Storytelling
  </text>

  <!-- Content Box -->
  <g transform="translate(48, 195)">
    <rect width="704" height="190" rx="16" fill="#000000" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.15" />
    
    <g transform="translate(24, 28)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">High-Energy Visual Direction &amp; Character Animation</text>
      <text x="0" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        Prompt Engineering · Persistent Facial Models · Cinematic Color Grading · Punchy Sound Design
      </text>
    </g>

    <!-- 4 Deliverable Pillars -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="150" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35" />
      <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1FAE5">1. Visual Styling</text>

      <rect x="165" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35" />
      <text x="180" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1FAE5">2. Character Motion</text>

      <rect x="340" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35" />
      <text x="355" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1FAE5">3. Color Grade</text>

      <rect x="515" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.35" />
      <text x="530" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D1FAE5">4. Dynamic Cut</text>
    </g>

    <text x="24" y="160" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6EE7B7">
      ▶ Video Master: DP.mp4 · Directed &amp; Produced by Sholly P
    </text>
  </g>

  <!-- Big Play Button -->
  <g transform="translate(710, 85)" opacity="0.9">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" />
    <polygon points="24,18 40,28 24,38" fill="#021F94" />
  </g>
</svg>
