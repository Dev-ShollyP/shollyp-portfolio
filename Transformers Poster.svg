<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="transBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F94" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#transBg)" />

  <!-- Thematic Glow Circles -->
  <circle cx="700" cy="80" r="220" fill="#3B82F6" opacity="0.15" />
  <circle cx="100" cy="400" r="180" fill="#06B6D4" opacity="0.12" />

  <!-- Badge -->
  <g transform="translate(48, 42)">
    <rect width="250" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25" />
    <circle cx="20" cy="17" r="5" fill="#06B6D4" />
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="1">RCCG OGUN PROVINCE 27</text>
  </g>

  <!-- Big Title -->
  <text x="48" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    "THE TRANSFORMERS"
  </text>
  <text x="48" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#67E8F9" font-weight="600">
    Youth Convention Multimedia &amp; Campaign Film Package
  </text>

  <!-- Content Box -->
  <g transform="translate(48, 195)">
    <rect width="704" height="190" rx="16" fill="#000000" fill-opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.15" />
    
    <g transform="translate(24, 28)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Full-Cycle Creative Direction &amp; Video Production Suite</text>
      <text x="0" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        Narrative Concept Script · Generative Visual Prompts · AI Soundtrack &amp; Foley · Synchronized SRT Subtitles
      </text>
    </g>

    <!-- 4 Deliverable Pillars -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="150" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.3" />
      <text x="15" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E0F2FE">1. Film Script</text>

      <rect x="165" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.3" />
      <text x="180" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E0F2FE">2. AI Prompts</text>

      <rect x="340" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.3" />
      <text x="355" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E0F2FE">3. AI Soundtrack</text>

      <rect x="515" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.3" />
      <text x="530" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E0F2FE">4. SRT Captions</text>
    </g>

    <text x="24" y="160" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">
      ▶ Video Master: The Transformer.mp4 · High Youth Provincial Engagement
    </text>
  </g>

  <!-- Big Play Button -->
  <g transform="translate(710, 85)" opacity="0.85">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" />
    <polygon points="24,18 40,28 24,38" fill="#021F94" />
  </g>
</svg>
