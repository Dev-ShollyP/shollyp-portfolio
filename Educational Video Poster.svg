<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#021F94" />
      <stop offset="100%" stop-color="#011566" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#eduBg)" />

  <!-- Lecture Hall Architectural Grid Overlay -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="380" x2="800" y2="380" />
    <line x1="0" y1="410" x2="800" y2="410" />
    <!-- Perspective lines -->
    <line x1="400" y1="180" x2="0" y2="450" />
    <line x1="400" y1="180" x2="200" y2="450" />
    <line x1="400" y1="180" x2="600" y2="450" />
    <line x1="400" y1="180" x2="800" y2="450" />
  </g>

  <!-- Category Chip -->
  <g transform="translate(48, 40)">
    <rect width="210" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" />
    <circle cx="20" cy="17" r="5" fill="#38BDF8" />
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="1">EDUCATIONAL AI VIDEO</text>
  </g>

  <!-- Title & Headline -->
  <text x="48" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    African Postgraduate Academic Series
  </text>
  <text x="48" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#93C5FD" font-weight="500">
    Provus' Discrepancy Model · CIPP Model · Atkins Model · Six-Model Comparison
  </text>

  <!-- Lecture Hall Blackboard / Framework Card -->
  <g transform="translate(48, 195)">
    <rect width="704" height="185" rx="16" fill="#000000" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.15" />
    
    <!-- Model Pills -->
    <g transform="translate(24, 28)">
      <rect width="190" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-opacity="0.4" />
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" font-weight="600">Provus Discrepancy</text>
    </g>

    <g transform="translate(230, 28)">
      <rect width="170" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.4" />
      <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" font-weight="600">CIPP Framework</text>
    </g>

    <g transform="translate(416, 28)">
      <rect width="180" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.4" />
      <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" font-weight="600">Atkins Evaluation</text>
    </g>

    <text x="24" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E2E8F0" font-weight="500">
      African postgraduate students in authentic university lecture hall settings
    </text>
    <text x="24" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">
      Dialogue-driven pedagogical storytelling · Pacing calibrated for maximum concept retention
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(24, 150)">
      <text x="0" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">
        ▶ Video Master: Adeolu.mp4 · 3-Minute Classroom Format · Filmora &amp; Google Flow
      </text>
    </g>
  </g>

  <!-- Big Play Button Center Watermark -->
  <g transform="translate(710, 85)" opacity="0.85">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" />
    <polygon points="24,18 40,28 24,38" fill="#021F94" />
  </g>
</svg>
