<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F94" />
      <stop offset="50%" stop-color="#0A184D" />
      <stop offset="100%" stop-color="#050C26" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Header Badge -->
  <rect x="50" y="36" width="310" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2" />
  <circle cx="68" cy="53" r="5" fill="#22C55E" />
  <text x="82" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E2E8F0" font-weight="600">CHURCHFLOW AI ARCHITECTURE</text>

  <text x="50" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
    RCCG Everflourishing Multi-Tenant System
  </text>
  <text x="50" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8">
    Deterministic Code Intercepts · Meta Cloud API · n8n Orchestrator · 24-File Supabase Schema with RLS
  </text>

  <!-- Flow Nodes -->
  <!-- Node 1: Inbound WhatsApp -->
  <g transform="translate(50, 160)">
    <rect width="180" height="180" rx="16" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
    <circle cx="90" cy="54" r="24" fill="#25D366" fill-opacity="0.2" />
    <circle cx="90" cy="54" r="16" fill="#25D366" />
    <path d="M84 54 C84 51 86 49 89 49 C92 49 94 51 94 54 C94 57 91 58 90 60 L90 61" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="90" cy="64" r="1" fill="#FFFFFF" />
    <text x="90" y="106" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Meta WhatsApp</text>
    <text x="90" y="124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="middle">Cloud API Webhook</text>
    <text x="90" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">500+ Members &amp; Guests</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M230 250 L300 250" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="302,250 292,244 292,256" fill="#38BDF8" />

  <!-- Node 2: n8n Core Orchestrator & Deterministic Intercept -->
  <g transform="translate(310, 150)">
    <rect width="200" height="200" rx="18" fill="url(#cardGrad)" stroke="#818CF8" stroke-opacity="0.5" stroke-width="2" filter="url(#glow)" />
    <rect width="200" height="200" rx="18" fill="#0A184D" fill-opacity="0.8" />
    <circle cx="100" cy="50" r="22" fill="#EA580C" />
    <text x="100" y="56" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">n8n</text>
    <text x="100" y="96" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Deterministic Intercept</text>
    <rect x="25" y="110" width="150" height="26" rx="6" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E" stroke-opacity="0.5" />
    <text x="100" y="127" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#4ADE80" text-anchor="middle">0% Hallucination Guard</text>
    <text x="100" y="156" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Facts / Hymns / Account #</text>
    <text x="100" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Passed instantly via Code</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M510 250 L560 250" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="562,250 552,244 552,256" fill="#818CF8" />

  <!-- Node 3: Supabase RLS & Gemini 2.0 Flash -->
  <g transform="translate(570, 160)">
    <rect width="180" height="180" rx="16" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" />
    <circle cx="90" cy="54" r="22" fill="#3ECF8E" />
    <path d="M88 42 L80 54 L90 54 L86 66 L98 52 L89 52 Z" fill="#FFFFFF" />
    <text x="90" y="104" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Supabase + Gemini</text>
    <text x="90" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399" text-anchor="middle">24-File Schema (RLS)</text>
    <text x="90" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Multi-Tenant Isolation</text>
    <text x="90" y="162" font-family="system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">+ Human Pastoral Handoff</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(50, 385)">
    <rect width="700" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1" />
    <text x="350" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD" text-anchor="middle">
      ✓ Visitor Onboarding · Prayer Requests · Counseling · Giving Info · Automated FAQs · Human Escalation
    </text>
  </g>
</svg>
