<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021F94" />
      <stop offset="45%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pasBg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="680" cy="90" r="210" fill="#F59E0B" opacity="0.12" />
  <circle cx="120" cy="380" r="190" fill="#8B5CF6" opacity="0.15" />

  <!-- Category Badge -->
  <g transform="translate(48, 42)">
    <rect width="250" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.25" />
    <circle cx="20" cy="17" r="5" fill="#F59E0B" />
    <text x="34" y="22" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="1">EVENT &amp; PASTORAL CAMPAIGN</text>
  </g>

  <!-- Big Title -->
  <text x="48" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    "PAS AD" COMMERCIAL
  </text>
  <text x="48" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#FDE047" font-weight="600">
    Pastoral Campaign &amp; High-Impact Event Promotional Film
  </text>

  <!-- Content Box -->
  <g transform="translate(48, 195)">
    <rect width="704" height="190" rx="16" fill="#000000" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.15" />
    
    <g transform="translate(24, 28)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Cinematic Event Storytelling &amp; Promo Direction</text>
      <text x="0" y="26" font-family="system-ui, sans-serif" font-size="13" fill="#CBD5E1">
        Dynamic Motion Typography · Atmospheric Lighting · Paced Scene Cuts · Custom Sound Engineering
      </text>
    </g>

    <!-- 4 Deliverable Pillars -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="150" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.35" />
      <text x="14" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FEF3C7">1. Event Theme Arc</text>

      <rect x="165" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.35" />
      <text x="180" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FEF3C7">2. Motion Overlays</text>

      <rect x="340" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.35" />
      <text x="355" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FEF3C7">3. Dynamic Foley</text>

      <rect x="515" y="0" width="160" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-opacity="0.35" />
      <text x="530" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FEF3C7">4. Master Reel</text>
    </g>

    <text x="24" y="160" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FDE047">
      ▶ Video Master: PAS AD.mp4 · Directed &amp; Produced by Sholly P
    </text>
  </g>

  <!-- Big Play Button -->
  <g transform="translate(710, 85)" opacity="0.9">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" />
    <polygon points="24,18 40,28 24,38" fill="#021F94" />
  </g>
</svg>
